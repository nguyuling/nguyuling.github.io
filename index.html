</footer>

<script>
    async function loadSection(file, containerId) {
        try {
            const response = await fetch(file);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const html = await response.text();
            document.getElementById(containerId).innerHTML = html;
        } catch (error) {
            console.error(`Failed to load ${file}:`, error);
        }
    }

    document.addEventListener('DOMContentLoaded', async function() {
        await loadSection('projects.html', 'projects-container');
        await loadSection('education.html', 'education-container');
        await loadSection('certs.html', 'certs-container');
        await loadSection('cocurriculum.html', 'cocurriculum-container');

        const gallery = document.querySelector('.experience-gallery');
        if (gallery) {
            const items = gallery.querySelectorAll('.experience-item');
            items.forEach(function(item) {
                const img = item.querySelector('img');
                if (img && img.alt) {
                    const label = document.createElement('div');
                    label.className = 'alt-label';
                    label.textContent = img.alt;
                    item.appendChild(label);
                }
            });
        }
    });
</script>

</body>
